<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ahmad Faruuq | AOA Real Estate</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{--ink:#1d1d1f;--muted:#515154;--line:#d2d2d7;--accent:#0058d6;--accent-press:#003f9e}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;min-height:100%;font:1.0625rem/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
header{padding:20px 24px}
header img{display:block;height:40px;width:auto}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:32px 24px 64px}
.eyebrow{margin:0;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(2.25rem,8vw,4rem);line-height:1.06;letter-spacing:-.03em;font-weight:700}
p{margin:0;max-width:30em;color:var(--muted);text-wrap:pretty}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;margin-top:8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;transition:transform 150ms ease-out,background-color 150ms ease}
.btn:hover{background:var(--accent-press)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
footer{padding:24px;border-top:1px solid var(--line);text-align:center;font-size:.8125rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<header><img src="assets/aoa-logo.png" alt="AOA Real Estate" width="76" height="40"></header>
<main>
  <p class="eyebrow">AOA Real Estate · PropNex</p>
  <h1>Ahmad Faruuq</h1>
  <p>My page is on its way. In the meantime, catch my latest property tours on Instagram.</p>
  <a class="btn" href="https://www.instagram.com/farvvq/" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>Follow @farvvq</a>
</main>
<footer>Ahmad Faruuq · PropNex Realty Pte Ltd, Licence No. L3008022J · © <span id="y">2026</span></footer>
<script>document.getElementById("y").textContent=new Date().getFullYear();</script>
</body>
</html>
